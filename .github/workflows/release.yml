name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v7.0.0

      - name: "Adjust version number"
        shell: "bash"
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          yq -i -o json ".version=\"${VERSION}\"" \
            "${{ github.workspace }}/custom_components/mawaqeet/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/mawaqeet"
          zip mawaqeet.zip -r ./ \
            -x "frontend/*" \
            -x "*/__pycache__/*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "brand/src/*"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ github.workspace }}/custom_components/mawaqeet/mawaqeet.zip
