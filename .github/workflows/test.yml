name: Test

on:
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
    branches:
      - "main"
      - "dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PREFER_BINARY: "1"

jobs:
  pytest:
    name: Pytest (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ha-version: [pinned, latest]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0

      - name: Read pinned Home Assistant version
        id: ha_pin
        run: |
          version=$(grep '^homeassistant==' requirements-test.txt | cut -d= -f3)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Restore pip cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.ha-version }}-${{ hashFiles('requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.ha-version }}-
            ${{ runner.os }}-pip-pinned-

      - name: Install test requirements
        run: python3 -m pip install -r requirements-test.txt pytest-cov

      - name: Upgrade Home Assistant stack to latest
        if: matrix.ha-version == 'latest'
        run: |
          python3 -m pip install -U \
            homeassistant \
            home-assistant-frontend \
            pytest-homeassistant-custom-component

      - name: Report Home Assistant version
        run: |
          echo "Matrix leg: ${{ matrix.ha-version }}"
          echo "Pinned in requirements-test.txt: ${{ steps.ha_pin.outputs.version }}"
          python3 -c "from homeassistant.const import __version__; print('homeassistant:', __version__)"
          python3 -c "import hass_frontend; print('home-assistant-frontend:', getattr(hass_frontend, '__version__', 'unknown'))"

      - name: Run tests
        run: |
          python3 -m pytest tests/ -v \
            --cov=custom_components/mawaqeet \
            --cov-report=term-missing \
            --cov-fail-under=95
