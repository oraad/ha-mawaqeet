name: Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
    branches:
      - "main"
      - "dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PREFER_BINARY: "1"

jobs:
  build:
    name: Lovelace card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: custom_components/mawaqeet/frontend
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: custom_components/mawaqeet/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build bundle
        run: npm run build

      - name: Verify committed bundle exists
        working-directory: ${{ github.workspace }}
        run: test -s custom_components/mawaqeet/www/mawaqeet-prayer-card.js

  pytest-latest-frontend:
    name: Pytest (HA latest, frontend)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Restore pip cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-latest-frontend-${{ hashFiles('requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-latest-frontend-
            ${{ runner.os }}-pip-latest-
            ${{ runner.os }}-pip-pinned-

      - name: Install test requirements
        run: python3 -m pip install -r requirements-test.txt pytest-cov

      - name: Upgrade Home Assistant stack to latest
        run: |
          python3 -m pip install -U \
            homeassistant \
            home-assistant-frontend \
            pytest-homeassistant-custom-component

      - name: Report Home Assistant version
        run: |
          python3 -c "from homeassistant.const import __version__; print('homeassistant:', __version__)"
          python3 -c "import hass_frontend; print('home-assistant-frontend:', getattr(hass_frontend, '__version__', 'unknown'))"

      - name: Run frontend integration tests
        run: |
          python3 -m pytest tests/test_frontend.py \
            tests/test_init.py::test_frontend_registration \
            tests/test_init.py::test_setup_entry_registers_frontend \
            tests/test_init.py::test_register_lovelace_resource \
            tests/test_init.py::test_setup_entry_registers_lovelace_resource \
            -v
