name: Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
    branches:
      - "main"
      - "dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Lovelace card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: custom_components/mawaqeet/frontend
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d34e9d0a0cfb4c238a3 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: custom_components/mawaqeet/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build bundle
        run: npm run build

      - name: Verify committed bundle exists
        working-directory: ${{ github.workspace }}
        run: test -s custom_components/mawaqeet/www/mawaqeet-prayer-card.js
