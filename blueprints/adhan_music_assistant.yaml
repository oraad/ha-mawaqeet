blueprint:
  name: Adhan (Music Assistant)
  description: >-
    Play adhan on prayer time through Music Assistant media players
    (media_player entities from the Music Assistant integration). Requires
    the Music Assistant integration. Supports media playback or announcement
    mode, with separate players and audio for Fajr vs other prayers. Select
    one or more Music Assistant players per prayer window; adhan plays on all
    selected speakers at once.
  domain: automation
  input:
    device_id:
      name: Location
      description: Select Mawaqeet device
      selector:
        device:
          filter:
            integration: mawaqeet
    playback_mode:
      name: Playback mode
      description: >-
        Media playback plays the adhan normally. Announcement ducks or pauses
        other audio on the player.
      default: media_playback
      selector:
        select:
          options:
            - label: Media playback
              value: media_playback
            - label: Announcement
              value: announcement
    enable_fajr:
      name: 'Enable: Fajr Adhan'
      default: true
      selector:
        boolean: {}
    enable_dhuhr:
      name: 'Enable: Dhuhr Adhan'
      default: true
      selector:
        boolean: {}
    enable_asr:
      name: 'Enable: Asr Adhan'
      default: true
      selector:
        boolean: {}
    enable_maghrib:
      name: 'Enable: Maghrib Adhan'
      default: true
      selector:
        boolean: {}
    enable_ishaa:
      name: 'Enable: Ishaa Adhan'
      default: true
      selector:
        boolean: {}
    player_fajr:
      name: Fajr Music Assistant player(s)
      description: >-
        One or more Music Assistant media_player entities for Fajr (for example
        media_player.ma_kitchen). Adhan plays on all selected speakers at once.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
              integration: music_assistant
    player_other:
      name: Other prayers Music Assistant player(s)
      description: >-
        One or more Music Assistant media_player entities for Dhuhr through
        Ishaa. Adhan plays on all selected speakers at once.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
              integration: music_assistant
    media_fajr_playback:
      name: Fajr adhan audio (playback)
      description: >-
        Adhan audio for Fajr in media playback mode. Leave empty if you only use
        announcement mode for Fajr.
      default:
        media_content_id: ""
        media_content_type: music
      selector:
        media:
          accept:
            - audio/*
            - music
    media_other_playback:
      name: Other prayers adhan audio (playback)
      description: >-
        Adhan audio for Dhuhr through Ishaa in media playback mode. Leave empty
        if you only use announcement mode for other prayers.
      default:
        media_content_id: ""
        media_content_type: music
      selector:
        media:
          accept:
            - audio/*
            - music
    media_fajr_announce:
      name: Fajr adhan audio (announcement)
      description: >-
        Adhan audio for Fajr in announcement mode. Prefer files in /config/www
        or http(s) URLs. Leave empty if you only use media playback for Fajr.
      default:
        media_content_id: ""
        media_content_type: music
      selector:
        media:
          accept:
            - audio/*
            - music
    media_other_announce:
      name: Other prayers adhan audio (announcement)
      description: >-
        Adhan audio for Dhuhr through Ishaa in announcement mode. Prefer files
        in /config/www or http(s) URLs. Leave empty if you only use media
        playback for other prayers.
      default:
        media_content_id: ""
        media_content_type: music
      selector:
        media:
          accept:
            - audio/*
            - music
    announce_volume_fajr:
      name: Fajr announcement volume
      description: >-
        Optional forced volume (0–100) for Fajr announcements. Leave empty to
        use the player default.
      default: null
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    announce_volume:
      name: Other prayers announcement volume
      description: >-
        Optional forced volume (0–100) for other prayer announcements. Leave
        empty to use the player default.
      default: null
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

trigger:
  - platform: device
    domain: mawaqeet
    device_id: !input device_id
    type: prayer_time

variables:
  playback_mode: !input playback_mode
  enable_fajr: !input enable_fajr
  enable_dhuhr: !input enable_dhuhr
  enable_asr: !input enable_asr
  enable_maghrib: !input enable_maghrib
  enable_ishaa: !input enable_ishaa
  current_prayer: "{{ trigger.event.data.prayer }}"
  player_fajr: !input player_fajr
  player_other: !input player_other
  media_fajr_playback: !input media_fajr_playback
  media_other_playback: !input media_other_playback
  media_fajr_announce: !input media_fajr_announce
  media_other_announce: !input media_other_announce
  announce_volume_fajr: !input announce_volume_fajr
  announce_volume: !input announce_volume
  adhan_entity_ids: >-
    {% set selection = player_fajr if current_prayer == 'fajr' else player_other %}
    {% if selection is string %}
      {{ [selection] }}
    {% else %}
      {{ selection | unique | list }}
    {% endif %}
  adhan_media_content_id: >-
    {% if playback_mode == 'announcement' %}
      {% if current_prayer == 'fajr' %}
        {{ media_fajr_announce.media_content_id | default('') }}
      {% else %}
        {{ media_other_announce.media_content_id | default('') }}
      {% endif %}
    {% else %}
      {% if current_prayer == 'fajr' %}
        {{ media_fajr_playback.media_content_id | default('') }}
      {% else %}
        {{ media_other_playback.media_content_id | default('') }}
      {% endif %}
    {% endif %}
  adhan_media_content_type: >-
    {% if playback_mode == 'announcement' %}
      {% if current_prayer == 'fajr' %}
        {{ media_fajr_announce.media_content_type | default('music') }}
      {% else %}
        {{ media_other_announce.media_content_type | default('music') }}
      {% endif %}
    {% else %}
      {% if current_prayer == 'fajr' %}
        {{ media_fajr_playback.media_content_type | default('music') }}
      {% else %}
        {{ media_other_playback.media_content_type | default('music') }}
      {% endif %}
    {% endif %}
  announce_vol: >-
    {% if playback_mode == 'announcement' %}
      {% if current_prayer == 'fajr' %}
        {{ announce_volume_fajr }}
      {% else %}
        {{ announce_volume }}
      {% endif %}
    {% endif %}

condition:
  - condition: template
    value_template: >-
      {% set p = trigger.event.data.prayer %}
      {{ (p == 'fajr' and enable_fajr) or (p == 'dhuhr' and enable_dhuhr) or
         (p == 'asr' and enable_asr) or (p == 'maghrib' and enable_maghrib) or
         (p == 'ishaa' and enable_ishaa) }}

action:
  - event: adhan_event
    event_data:
      prayer: "{{ current_prayer }}"
  - condition: template
    value_template: >-
      {{ adhan_entity_ids | length > 0 and adhan_media_content_id | length > 0 }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ playback_mode == 'media_playback' }}"
        sequence:
          - action: music_assistant.play_media
            target:
              entity_id: "{{ adhan_entity_ids }}"
            data:
              media_id: "{{ adhan_media_content_id }}"
              media_type: "{{ adhan_media_content_type }}"
              enqueue: play
      - conditions:
          - condition: template
            value_template: "{{ playback_mode == 'announcement' }}"
        sequence:
          - action: media_source.resolve_media
            data:
              media_content_id: "{{ adhan_media_content_id }}"
              media_content_type: "{{ adhan_media_content_type }}"
            response_variable: resolved_adhan
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ announce_vol is number }}"
                sequence:
                  - action: music_assistant.play_announcement
                    target:
                      entity_id: "{{ adhan_entity_ids }}"
                    data:
                      url: >-
                        {% if adhan_media_content_id is match('https?://.*') %}
                          {{ adhan_media_content_id }}
                        {% else %}
                          {{ resolved_adhan.url }}
                        {% endif %}
                      announce_volume: "{{ announce_vol }}"
              - conditions: []
                sequence:
                  - action: music_assistant.play_announcement
                    target:
                      entity_id: "{{ adhan_entity_ids }}"
                    data:
                      url: >-
                        {% if adhan_media_content_id is match('https?://.*') %}
                          {{ adhan_media_content_id }}
                        {% else %}
                          {{ resolved_adhan.url }}
                        {% endif %}

mode: single
