# Quality Scale for Mawaqeet
# https://developers.home-assistant.io/docs/core/integration-quality-scale/

rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  entity-unavailable:
    status: exempt
    comment: Calculated prayer times are always available for a valid location.
  has-entity-name: done
  integration-owner: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Prayer times are calculated locally; no external service to validate.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: trigger_event validates config entry and prayer; failures surface as service errors.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  log-when-unavailable:
    status: exempt
    comment: No network device; prayer times are calculated locally.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No credentials or external accounts.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  entity-category: done
  entity-device-class: done
  entity-translations: done
  icon-translations: done
  reconfiguration-flow: done

  # Platinum
  async-dependency:
    status: todo
    comment: adhanpy is sync-only; platinum needs an async PyPI client or upstream asyncio in adhanpy.
  inject-websession:
    status: exempt
    comment: No HTTP client dependency; local calculation only.
  strict-typing:
    status: todo
    comment: Optional follow-up — mypy.ini exists; add CI when pursuing platinum.

  # Exempt — not applicable
  discovery:
    status: exempt
    comment: Location-based setup; no hardware discovery.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-supported-devices:
    status: exempt
    comment: Any map coordinates; not tied to specific hardware products.
  dynamic-devices:
    status: exempt
    comment: One device per config entry created at setup.
  entity-disabled-by-default:
    status: exempt
    comment: Optional Midnight and Last Third sensors remain available; not required daily.
  exception-translations:
    status: exempt
    comment: Config flow and services use standard HA validation errors.
  repair-issues:
    status: exempt
    comment: Reconfigure flow covers location and method changes; no repair issues needed.
  stale-devices:
    status: exempt
    comment: Device is removed when the config entry is removed.
